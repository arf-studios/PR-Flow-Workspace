<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partikel</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b10; color: #fff; font-family: sans-serif; }
  #particles { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  main { position: relative; z-index: 1; display: grid; place-items: center; height: 100%; }
</style>
</head>
<body>
<canvas id="particles"></canvas>
<main><h1>Website Saya</h1></main>

<script>
(() => {
  // ====== PENGATURAN ======
  const DENSITY = 0.00008;   // partikel per piksel persegi
  const MAX_PARTICLES = 160;
  const SPEED = 0.3;         // makin besar makin cepat
  const MIN_R = 0.4, MAX_R = 1.8;
  const ALPHAS = [0.3, 0.55, 0.8]; // 3 kelompok opacity
  // ========================

  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let w, h, dpr, n;
  let x, y, vx, vy, r, g;    // typed array = cepat & hemat memori
  let raf = 0, last = 0, resizeTimer;

  function init() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    n = Math.min(MAX_PARTICLES, Math.floor(w * h * DENSITY));
    x = new Float32Array(n); y = new Float32Array(n);
    vx = new Float32Array(n); vy = new Float32Array(n);
    r = new Float32Array(n);  g = new Uint8Array(n);

    for (let i = 0; i < n; i++) {
      x[i] = Math.random() * w;
      y[i] = Math.random() * h;
      vx[i] = (Math.random() - 0.5) * SPEED;
      vy[i] = (Math.random() - 0.5) * SPEED;
      r[i] = MIN_R + Math.random() * (MAX_R - MIN_R);
      g[i] = Math.floor(Math.random() * ALPHAS.length);
    }
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#fff';
    for (let k = 0; k < ALPHAS.length; k++) {
      ctx.globalAlpha = ALPHAS[k];
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        if (g[i] !== k) continue;
        ctx.moveTo(x[i] + r[i], y[i]);
        ctx.arc(x[i], y[i], r[i], 0, 6.2832);
      }
      ctx.fill();
    }
  }

  function loop(t) {
    const dt = Math.min((t - last) / 16.667, 3); // normalisasi ke 60fps
    last = t;
    for (let i = 0; i < n; i++) {
      x[i] += vx[i] * dt;
      y[i] += vy[i] * dt;
      if (x[i] < -2) x[i] = w + 2; else if (x[i] > w + 2) x[i] = -2;
      if (y[i] < -2) y[i] = h + 2; else if (y[i] > h + 2) y[i] = -2;
    }
    draw();
    raf = requestAnimationFrame(loop);
  }

  function start() {
    if (reduceMotion || raf) return;
    last = performance.now();
    raf = requestAnimationFrame(loop);
  }
  function stop() { cancelAnimationFrame(raf); raf = 0; }

  addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(init, 150);
  });
  document.addEventListener('visibilitychange', () => {
    document.hidden ? stop() : start();
  });

  init();
  start();
})();
</script>
</body>
</html>
